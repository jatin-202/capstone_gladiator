<!-- LOGIN PAGE -->
<!-- ✅ IMPORTANT: VIDEO -->
<video autoplay muted loop playsinline class="signin-video">
  <source src="assets/videos/32975-394513987.mp4" type="video/mp4" />
</video>

<div class="signin-overlay"></div>

<div class="signin-wrapper">

  <button class="back-btn" (click)="goBack()">← Back</button>

  <div class="signin-card">

    <h2 class="signin-title">Sign In</h2>
    <p class="signin-subtitle">Enter your credentials</p>

    <div class="alert-error" *ngIf="showError">
      {{ errorMessage }}
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

      <div class="input-group">
        <label>Username</label>
        <input formControlName="username" placeholder="Enter username" />
      </div>

      <div class="input-group password-group">
        <label>Password</label>

        <div class="password-wrapper">
          <input [type]="showPassword ? 'text' : 'password'" formControlName="password" placeholder="••••••" />

          <button type="button" class="eye-btn" (click)="showPassword = !showPassword">
            <!-- Eye Open -->
            <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24"
              fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z" />
              <circle cx="12" cy="12" r="3" />
            </svg>

            <!-- Eye Closed -->
            <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24"
              fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20C5 20 1 12 1 12a21.77 21.77 0 0 1 5.06-7.94" />
              <path d="M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a21.8 21.8 0 0 1-2.16 3.19" />
              <path d="M1 1l22 22" />
            </svg>
          </button>
        </div>
      </div>

      <!-- ✅ FORGOT PASSWORD LINK -->
      <div class="forgot-link">
        <a routerLink="/forgot-password">Forgot Password?</a>
      </div>

      <button type="submit" class="btn-gold signin-btn">Login</button>

    </form>

    <p class="register-link">
      Don't have an account?
      <a routerLink="/register"><strong>Register</strong></a>
    </p>

  </div>
</div>
