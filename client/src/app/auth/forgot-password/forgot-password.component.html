    <div class="signin-overlay"></div>

    <div class="otp-wrapper">

        <div class="otp-card">

            <!-- STEP 1: Enter Email -->
            <div *ngIf="step === 1">
                <h2 class="otp-title">✈️ Forgot Password</h2>
                <p class="otp-subtitle">
                    Enter your registered email to<br>
                    receive a password reset OTP
                </p>

                <!-- Alerts -->
                <div class="alert-success" *ngIf="message">{{ message }}</div>
                <div class="alert-error" *ngIf="errorMessage">{{ errorMessage }}</div>

                <div class="input-group">
                    <input type="email" [(ngModel)]="email" placeholder="Enter your registered email"
                        (keyup.enter)="sendOtp()" />
                </div>

                <button class="btn-gold" (click)="sendOtp()" [disabled]="loading">
                    {{ loading ? 'Sending OTP...' : 'Send OTP →' }}
                </button>

                <p class="back-link">
                    <a routerLink="/login">← Back to Login</a>
                </p>
            </div>

            <!-- STEP 2: OTP + New Password -->
            <div *ngIf="step === 2">
                <h2 class="otp-title">✈️ Reset Password</h2>
                <p class="otp-subtitle">
                    Enter the OTP sent to<br>
                    <strong>{{ email }}</strong>
                </p>

                <!-- Alerts -->
                <div class="alert-success" *ngIf="message">{{ message }}</div>
                <div class="alert-error" *ngIf="errorMessage">{{ errorMessage }}</div>

                <!-- OTP Input -->
                <div class="input-group">
                    <input type="text" [(ngModel)]="otp" placeholder="Enter 6-digit OTP" maxlength="6" />
                </div>

                <!-- New Password -->
                <div class="input-group">
                    <input type="password" [(ngModel)]="newPassword" placeholder="New Password" />
                </div>

                <!-- Confirm Password -->
                <div class="input-group">
                    <input type="password" [(ngModel)]="confirmPassword" placeholder="Confirm Password"
                        (keyup.enter)="resetPassword()" />
                </div>

                <button class="btn-gold" (click)="resetPassword()" [disabled]="loading">
                    {{ loading ? 'Resetting...' : 'Reset Password →' }}
                </button>

                <div class="resend-section">
                    <a (click)="sendOtp()" class="resend-link">Resend OTP</a>
                </div>

                <p class="back-link">
                    <a (click)="step = 1">← Back</a>
                </p>
            </div>

        </div>
    </div>
