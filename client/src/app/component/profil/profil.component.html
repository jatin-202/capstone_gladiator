<div class="profile-page">

  <h3>My Profile</h3>

  <div class="profile-card" *ngIf="user">

    <div class="profile-header">
      ✈
    </div>

    <table class="profile-table">

      <tbody>

        <tr>
          <th>Username</th>
          <td>{{ user.username }}</td>
        </tr>

        <tr>
          <th>Role</th>
          <td>
            <span class="role-badge">
              {{ user.role }}
            </span>
          </td>
        </tr>

        <tr>
          <th>User ID</th>
          <td>{{ user.userId }}</td>
        </tr>

      </tbody>

    </table>

  </div>

</div>
