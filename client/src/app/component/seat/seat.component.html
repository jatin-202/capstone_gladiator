<div class="seat-container" *ngIf="seatMap.length > 0">

  <h6>Select a Seat</h6>

  <div *ngFor="let row of seatMap; let i = index">

    <!-- FIRST CLASS -->
    <div class="cabin-label" *ngIf="i === 0">

      FIRST CLASS
    </div>

    <!-- BUSINESS CLASS -->
    <div class="cabin-label" *ngIf="i === getFirstClassRows()">

      BUSINESS CLASS
    </div>

    <!-- ECONOMY CLASS -->
    <div class="cabin-label" *ngIf="
        i ===
        getFirstClassRows() +
        getBusinessRows()
      ">

      ECONOMY CLASS
    </div>

    <!-- ROW -->
    <div class="seat-row">

      <!-- ROW NUMBER -->
      <div class="row-number">
        {{ row[0]?.rowLabel }}
      </div>

      <!-- LEFT SIDE -->
      <ng-container *ngFor="let seat of row; let seatIndex = index">

        <!-- AISLE GAP -->
        <div *ngIf="seatIndex === 3" class="aircraft-aisle">
        </div>

        <!-- SEAT -->
        <button type="button" class="btn btn-sm seat-btn" [ngClass]="{

            'selected-seat':
              isSeatSelected(seat.seatNumber),

            'booked-seat':
              seat.booked,

            'window-seat':
              seat.seatNumber.endsWith('A') ||
              seat.seatNumber.endsWith('F'),

            'aisle-seat':
              seat.seatNumber.endsWith('C') ||
              seat.seatNumber.endsWith('D'),

            'middle-seat':
              seat.seatNumber.endsWith('B') ||
              seat.seatNumber.endsWith('E')

          }" [disabled]="seat.booked" (click)="selectSeat(seat)" [title]="
            seat.seatNumber +
            ' - ₹' +
            seat.price
          ">

          {{ seat.seatNumber }}

        </button>

      </ng-container>

    </div>

  </div>

  <!-- LEGEND -->
  <div class="seat-legend">

    <div class="legend-item">
      <div class="legend-box legend-available"></div>
      Available
    </div>

    <div class="legend-item">
      <div class="legend-box legend-selected"></div>
      Selected
    </div>

    <div class="legend-item">
      <div class="legend-box legend-booked"></div>
      Booked
    </div>

    <div class="legend-item">
      <div class="legend-box legend-window"></div>
      Window
    </div>

    <div class="legend-item">
      <div class="legend-box legend-aisle"></div>
      Aisle
    </div>

    <div class="legend-item">
      <div class="legend-box legend-middle"></div>
      Middle
    </div>

  </div>

</div>
